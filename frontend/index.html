<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente — Kumulus</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1e222e;
    --line: #2a2f3d;
    --text: #e6e8ee;
    --text-dim: #9aa1b1;
    --accent: #4f8cff;
    --accent-soft: #1c2c4a;
    --user-bubble: #2563eb;
    --bot-bubble: #1e222e;
    --radius: 14px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .logo {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #7db0ff);
    display: grid;
    place-items: center;
    font-weight: 700;
    color: #fff;
    font-size: 18px;
    flex-shrink: 0;
  }

  header .titles h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  header .titles p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  .session-tag {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 5px 10px;
    border-radius: 20px;
    font-variant-numeric: tabular-nums;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .wrap {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    animation: rise 0.25s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 8px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 600;
  }
  .msg.bot .avatar { background: var(--accent-soft); color: var(--accent); }
  .msg.user .avatar { background: #33405c; color: #cdd8f0; }

  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    line-height: 1.5;
    font-size: 14.5px;
    max-width: 78%;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--line);
    border-top-left-radius: 4px;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-top-right-radius: 4px;
  }

  .bubble img.enviada {
    display: block;
    max-width: 100%;
    max-height: 260px;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .bubble img.enviada:only-child { margin-bottom: 0; }

  .typing .bubble { display: flex; gap: 4px; align-items: center; padding: 14px 16px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.4s infinite both;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  .empty {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    max-width: 400px;
    padding: 20px;
  }
  .empty .big {
    width: 54px; height: 54px;
    border-radius: 14px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid; place-items: center;
    font-size: 26px;
    margin: 0 auto 16px;
  }
  .empty h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; font-weight: 600; }
  .empty p { font-size: 13.5px; line-height: 1.6; }
  .empty kbd {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12px;
    font-family: var(--font);
  }

  footer {
    padding: 14px 16px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }

  .composer-area { max-width: 760px; margin: 0 auto; }

  #preview {
    display: none;
    margin-bottom: 10px;
    position: relative;
    width: fit-content;
  }
  #preview.ativo { display: block; }
  #preview img {
    max-height: 90px;
    max-width: 200px;
    border-radius: 10px;
    border: 1px solid var(--line);
    display: block;
  }
  #removerImg {
    position: absolute;
    top: -7px; right: -7px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    display: grid;
    place-items: center;
    padding: 0;
  }
  #removerImg:hover { background: #3a4155; }

  .composer { display: flex; gap: 10px; align-items: flex-end; }

  .campo {
    flex: 1;
    display: flex;
    align-items: flex-end;
    gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px 4px 4px 12px;
    transition: border-color 0.15s;
  }
  .campo:focus-within { border-color: var(--accent); }

  textarea {
    flex: 1;
    resize: none;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 9px 0;
    font-family: var(--font);
    font-size: 14.5px;
    line-height: 1.4;
    max-height: 140px;
    outline: none;
  }
  textarea::placeholder { color: var(--text-dim); }

  button.anexar {
    background: transparent;
    border: none;
    color: var(--text-dim);
    width: 34px; height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    transition: color 0.15s, background 0.15s;
  }
  button.anexar:hover { color: var(--text); background: #2a3040; }

  button.send {
    background: var(--accent);
    border: none;
    color: #fff;
    width: 44px; height: 44px;
    border-radius: 12px;
    cursor: pointer;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }
  button.send:hover:not(:disabled) { background: #6ba0ff; }
  button.send:active:not(:disabled) { transform: scale(0.94); }
  button.send:disabled { opacity: 0.4; cursor: not-allowed; }

  .hint {
    margin: 8px auto 0;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }

  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="logo">K</div>
  <div class="titles">
    <h1>Assistente Kumulus</h1>
    <p>Powered by Azure OpenAI · gpt-5-mini</p>
  </div>
  <div class="session-tag" id="sessionTag">sessão: —</div>
</header>

<main id="chat">
  <div class="wrap" id="wrap">
    <div class="empty" id="empty">
      <div class="big">💬</div>
      <h2>Comece uma conversa</h2>
      <p>Faça uma pergunta ou cole um print com <kbd>Ctrl</kbd> + <kbd>V</kbd> para o assistente descrever a imagem. Ele lembra do que já foi dito nesta sessão.</p>
    </div>
  </div>
</main>

<footer>
  <div class="composer-area">
    <div id="preview">
      <img id="previewImg" alt="Imagem anexada">
      <button id="removerImg" title="Remover imagem">✕</button>
    </div>
    <div class="composer">
      <div class="campo">
        <textarea id="input" rows="1" placeholder="Escreva sua pergunta ou cole um print..." autofocus></textarea>
        <button class="anexar" id="anexar" title="Anexar imagem">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>
      <button class="send" id="send" title="Enviar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
    <p class="hint">O assistente pode cometer erros. As respostas são geradas por IA.</p>
  </div>
</footer>

<script>
  // ====== CONFIGURACAO ======
  const API_URL = "https://func-rafael-tomiazi-btedgwa9b6g9cndf.eastus-01.azurewebsites.net/api/ask";
  const MAX_LADO = 1568;  // redimensiona imagens grandes para nao pesar o payload

  // gera um session_id unico quando a pagina abre.
  // todas as perguntas desta aba compartilham o mesmo id, entao o backend
  // mantem o contexto (inclusive as imagens, guardadas no blob storage)
  const sessionId = "web-" + Math.random().toString(36).slice(2, 10);

  const chat = document.getElementById("chat");
  const wrap = document.getElementById("wrap");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const anexarBtn = document.getElementById("anexar");
  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  const previewImg = document.getElementById("previewImg");
  const removerImg = document.getElementById("removerImg");
  const empty = document.getElementById("empty");
  document.getElementById("sessionTag").textContent = "sessão: " + sessionId;

  let imagemAtual = null;  // guarda o data uri da imagem anexada

  // cresce o textarea conforme digita
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  // enter envia, shift+enter quebra linha
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      enviar();
    }
  });
  sendBtn.addEventListener("click", enviar);

  // ---- anexar por botao ----
  anexarBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) processarImagem(file);
    fileInput.value = "";
  });

  // ---- colar imagem com ctrl+v ----
  document.addEventListener("paste", (e) => {
    const itens = e.clipboardData ? e.clipboardData.items : null;
    if (!itens) return;
    for (const item of itens) {
      if (item.type.startsWith("image/")) {
        e.preventDefault();
        const file = item.getAsFile();
        if (file) processarImagem(file);
        return;
      }
    }
  });

  // ---- arrastar e soltar ----
  document.addEventListener("dragover", (e) => e.preventDefault());
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    const file = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null;
    if (file && file.type.startsWith("image/")) processarImagem(file);
  });

  removerImg.addEventListener("click", limparImagem);

  function limparImagem() {
    imagemAtual = null;
    preview.classList.remove("ativo");
    previewImg.src = "";
  }

  // le o arquivo, redimensiona se for muito grande e guarda como data uri
  function processarImagem(file) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width;
        let height = img.height;

        // so redimensiona se passar do limite, mantendo a proporcao
        if (width > MAX_LADO || height > MAX_LADO) {
          const escala = MAX_LADO / Math.max(width, height);
          width = Math.round(width * escala);
          height = Math.round(height * escala);
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);

        imagemAtual = canvas.toDataURL("image/png");
        previewImg.src = imagemAtual;
        preview.classList.add("ativo");
        input.focus();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function addMsg(texto, quem, dataUri) {
    if (empty && empty.parentNode) empty.remove();
    const msg = document.createElement("div");
    msg.className = "msg " + quem;
    const avatar = quem === "user" ? "V" : "K";
    msg.innerHTML = '<div class="avatar">' + avatar + '</div><div class="bubble"></div>';

    const bubble = msg.querySelector(".bubble");
    if (dataUri) {
      const img = document.createElement("img");
      img.className = "enviada";
      img.src = dataUri;
      bubble.appendChild(img);
    }
    if (texto) {
      bubble.appendChild(document.createTextNode(texto));
    }

    wrap.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
    return msg;
  }

  function addTyping() {
    const msg = document.createElement("div");
    msg.className = "msg bot typing";
    msg.innerHTML = '<div class="avatar">K</div><div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    wrap.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
    return msg;
  }

  async function enviar() {
    const pergunta = input.value.trim();
    const imagem = imagemAtual;

    // precisa de pelo menos um dos dois
    if (!pergunta && !imagem) return;

    input.value = "";
    input.style.height = "auto";
    input.disabled = true;
    sendBtn.disabled = true;
    limparImagem();

    addMsg(pergunta, "user", imagem);
    const typing = addTyping();

    try {
      const corpo = { session_id: sessionId };
      if (pergunta) corpo.pergunta = pergunta;
      if (imagem) corpo.imagem = imagem;

      const resp = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(corpo)
      });

      typing.remove();

      if (!resp.ok) {
        addMsg("Não consegui obter uma resposta agora (erro " + resp.status + "). Tente de novo em instantes.", "bot");
      } else {
        const dados = await resp.json();
        addMsg(dados.resposta || "Resposta vazia.", "bot");
      }
    } catch (err) {
      typing.remove();
      addMsg("Falha de conexão com o servidor. Verifique sua internet e tente novamente.", "bot");
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>

</body>
</html>
